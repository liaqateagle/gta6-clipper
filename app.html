<script>
// YouTube tab + Settings card. Merge into app.html's <script>. api(path, body?) is the app's helper (GET without body, POST with).
// Needs routes from ytstats.handle plus POST /api/yt/ideas {run,file} -> {titles:[5],hooks:[3],recut:""} (app.py runs ytstats.ai_prompt with the chosen AI) or {error}.
const ytEl = (t, css, txt, kids) => { const e = document.createElement(t); if (css) e.style.cssText = css; if (txt != null) e.textContent = txt; (kids || []).forEach(k => e.append(k)); return e; };
const ytBtn = (txt, fn, css) => { const b = ytEl('button', css || '', txt); b.onclick = fn; return b; };
const ytNum = n => n == null ? '-' : Math.round(n).toLocaleString();

async function renderYtPanel(container, short, api) {
  container.replaceChildren();
  const st = await api('/api/yt/status'), q = `?run=${encodeURIComponent(short.run)}&file=${encodeURIComponent(short.file)}`;
  const note = (t, c) => container.append(ytEl('div', `padding:10px 12px;border:2px solid var(--l);border-radius:var(--r);margin:8px 0;color:${c || 'var(--m)'}`, t));
  if (!st.has_key) {note(t('ui.ytp_nokey')); return container.append(ytBtn(t('ui.ytp_addkey'), () => { E('st').click(); setTimeout(() => E('ytset').scrollIntoView(), 150); }));}
  const link = ytEl('input', 'flex:1;min-width:200px;min-height:44px;padding:8px 12px;background:var(--bg);color:var(--t);border:2px solid var(--l);border-radius:var(--r)');
  link.placeholder = t('ui.ytp_paste'); link.setAttribute('aria-label', t('ui.ytp_link_al'));
  const body = ytEl('div'), go = async () => {
    body.replaceChildren(ytEl('div', 'color:var(--m)', t('os.loading')));
    const d = await api('/api/yt/diagnose' + q); body.replaceChildren();
    if (d.error) return body.append(ytEl('div', 'color:var(--f)', d.error));
    if (!d.linked) return body.append(ytEl('div', 'color:var(--m)', d.hint + ' ' + t(st.channel ? 'ui.ytp_or_post' : 'ui.ytp_add_ch')));
    const v = d.video, m = d.median || {}, a = d.analytics || {}, tiles = ytEl('div', 'display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0');
    const tile = (label, val, med, bad) => tiles.append(ytEl('div', `background:var(--c);border:2px solid ${bad ? 'var(--f)' : 'var(--l)'};border-radius:var(--r);padding:10px;box-shadow:var(--sh)`, null,
      [ytEl('div', 'font:12px system-ui;color:var(--m)', label), ytEl('div', 'font:700 22px var(--fd)', val), ytEl('div', 'font:12px system-ui;color:var(--m)', med == null ? '' : t('ui.ytp_median', { v: med }))]));
    tile(t('ui.yt_views'), ytNum(v.views), ytNum(m.views), m.views && v.views < .5 * m.views);
    tile(t('ui.yt_likes'), ytNum(v.likes), ytNum(m.likes)); tile(t('ui.yt_comments'), ytNum(v.comments));
    if (a.averageViewPercentage != null) tile(t('ui.yt_avg'), Math.round(a.averageViewPercentage) + '%', m.averageViewPercentage != null ? Math.round(m.averageViewPercentage) + '%' : null, m.averageViewPercentage && a.averageViewPercentage < .8 * m.averageViewPercentage);
    if (a.kept_at_3s != null) tile(t('ui.yt_3s'), Math.round(a.kept_at_3s * 100) + '%', null, a.kept_at_3s < .7);
    if (a.subscribersGained != null) tile(t('ui.yt_subs'), ytNum(a.subscribersGained), m.subscribersGained != null ? ytNum(m.subscribersGained) : null);
    body.append(ytEl('div', 'font-weight:600', v.title), tiles);
    if (d.level === 'key') body.append(ytEl('div', 'color:var(--m);font-size:13px', t(st.has_oauth ? 'ui.ytp_signin' : 'ui.ytp_addoauth')));
    const col = { bad: 'var(--f)', warn: 'var(--w)', info: 'var(--at)' };
    body.append(ytEl('h3', 'margin:14px 0 6px', d.reasons.length ? t('ui.ytp_why') : t('ui.ytp_none')),
      ...d.reasons.map(r => ytEl('div', `border-left:5px solid ${col[r.level] || 'var(--l)'};padding:6px 10px;margin:6px 0;background:var(--p)`, r.text)));
    const out = ytEl('div'), ideas = ytBtn(t('ui.ytp_ideas'), async () => {
      out.replaceChildren(ytEl('div', 'color:var(--m)', t('ui.ytp_asking')));
      const r = await api('/api/yt/ideas', { run: short.run, file: short.file }); out.replaceChildren();
      if (r.error) return out.append(ytEl('div', 'color:var(--f)', r.error));
      const sect = (h, arr) => out.append(ytEl('h3', 'margin:12px 0 4px', h), ...arr.map(x => ytEl('div', 'display:flex;gap:8px;align-items:center;margin:4px 0', null, [ytEl('span', 'flex:1', x), ytBtn(t('ui.copy'), e => { navigator.clipboard.writeText(x); e.target.textContent = t('ui.copied'); })])));
      sect(t('ui.yt_titles'), r.titles || []); sect(t('ui.yt_hooks'), r.hooks || []); if (r.recut) sect(t('ui.yt_recut'), [r.recut]);
    }, 'margin-top:12px;border-color:var(--a)');
    body.append(ideas, out);
  };
  container.append(ytEl('div', 'display:flex;gap:8px;flex-wrap:wrap', null, [link, ytBtn(t('ui.ytp_link_btn'), async () => { const r = await api('/api/yt/link', { run: short.run, file: short.file, url: link.value }); r.error ? note(r.error, 'var(--f)') : go(); })]), body);
  go();
}

async function renderYtSettings(container, api) {
  const draw = async () => {
    const st = await api('/api/yt/status'); container.replaceChildren();
    const inp = (ph, type) => { const i = ytEl('input', 'min-height:44px;padding:8px 12px;background:var(--bg);color:var(--t);border:2px solid var(--l);border-radius:var(--r);width:100%;box-sizing:border-box;margin:4px 0'); i.placeholder = ph; i.type = type || 'text'; i.setAttribute('aria-label', ph); i.autocomplete = 'off'; return i; };
    const key = inp(t('ui.yt_key_ph'), 'password'), ch = inp(t('ui.yt_ch_ph')); ch.value = st.channel || '';
    const msg = ytEl('div', 'color:var(--m);margin-top:6px'), file = ytEl('input'); file.type = 'file'; file.accept = '.json'; file.setAttribute('aria-label', 'OAuth client JSON');
    container.append(ytEl('h3', 'margin:0 0 6px', t('os.yt_stats')),
      ytEl('div', 'color:var(--m);font-size:13px', t('ui.yt_desc')),
      ytEl('div', 'margin:6px 0', st.has_key ? t('ui.yt_key_saved') : t('ui.yt_no_key')), key, ch,
      ytBtn(t('os.save'), async () => { const r = await api('/api/yt/key', { api_key: key.value, channel: ch.value }); r.error ? (msg.style.color = 'var(--f)', msg.textContent = r.error) : draw(); }),
      ytEl('div', 'margin:14px 0 4px', st.signed_in ? t('ui.yt_signed') : t('ui.yt_oauth_opt')), file,
      ytBtn(t('ui.yt_add_sign'), async () => { if (!file.files[0]) return; const r = await api('/api/yt/oauth', { client_json: await file.files[0].text() }); if (r.error) { msg.style.color = 'var(--f)'; msg.textContent = r.error; } else { window.open(r.auth_url, '_blank', 'noopener'); msg.textContent = t('ui.yt_finish'); } }, 'margin-left:8px'), msg);
  };
  draw();
}

'v.intro':["Say <b>one sentence</b> about this moment, a few seconds long. Your take is what makes the clip yours. The game sound drops while you talk and comes back after. You get a new version; the original stays.", "Dites <b>une phrase</b> sur ce moment, quelques secondes. Votre commentaire rend le clip unique. Le son du jeu baisse pendant que vous parlez et revient après. Vous obtenez une nouvelle version ; l'original reste.", "Di <b>una frase</b> sobre este momento, de unos segundos. Tu comentario es lo que hace tuyo el clip. El sonido del juego baja mientras hablas y vuelve después. Obtienes una versión nueva; el original se queda.", "Diga <b>uma frase</b> sobre este momento, de alguns segundos. Seu comentário é o que torna o clipe seu. O som do jogo abaixa enquanto você fala e volta depois. Você recebe uma nova versão; o original fica.", "Sag <b>einen Satz</b> zu diesem Moment, ein paar Sekunden lang. Dein Kommentar macht den Clip zu deinem. Der Spielsound wird leiser, während du sprichst, und kommt danach zurück. Du bekommst eine neue Version; das Original bleibt.", "قل <b>جملة واحدة</b> عن هذه اللحظة، لبضع ثوانٍ. تعليقك هو ما يجعل المقطع لك. يخفت صوت اللعبة أثناء حديثك ويعود بعده. تحصل على نسخة جديدة؛ والأصل يبقى.", "Di' <b>una frase</b> su questo momento, di pochi secondi. Il tuo commento rende la clip tua. L'audio del gioco si abbassa mentre parli e torna dopo. Ottieni una nuova versione; l'originale resta.", "Bu an hakkında <b>bir cümle</b> söyle, birkaç saniyelik. Yorumun klibi senin yapan şey. Oyun sesi sen konuşurken kısılır ve sonra geri gelir. Yeni bir sürüm alırsın; orijinal kalır."],

'h.a1':["The app and the skill are free. It runs inside an AI tool: Claude Code needs a Claude Pro or Max plan. Free routes: OpenCode on its free models, Antigravity's free quota, or <b>No AI</b> in Settings (always free, weaker picks).", "L'app et le skill sont gratuits. Elle fonctionne dans un outil IA : Claude Code nécessite un abonnement Claude Pro ou Max. Options gratuites : OpenCode avec ses modèles gratuits, le quota gratuit d'Antigravity, ou <b>No AI</b> dans les Réglages (toujours gratuit, choix moins bons).", "La app y el skill son gratis. Funciona dentro de una herramienta de IA: Claude Code requiere un plan Claude Pro o Max. Rutas gratis: OpenCode con sus modelos gratuitos, la cuota gratis de Antigravity, o <b>No AI</b> en Ajustes (siempre gratis, elecciones más débiles).", "O app e a skill são grátis. Ele roda dentro de uma ferramenta de IA: Claude Code precisa de um plano Claude Pro ou Max. Rotas grátis: OpenCode com seus modelos gratuitos, a cota grátis do Antigravity, ou <b>No AI</b> nos Ajustes (sempre grátis, escolhas mais fracas).", "App und Skill sind kostenlos. Sie läuft in einem KI-Tool: Claude Code braucht ein Claude Pro- oder Max-Abo. Kostenlose Wege: OpenCode mit seinen kostenlosen Modellen, das Gratiskontingent von Antigravity oder <b>No AI</b> in den Einstellungen (immer kostenlos, schwächere Auswahl).", "التطبيق والمهارة مجانيان. يعمل داخل أداة ذكاء اصطناعي: Claude Code يتطلب خطة Claude Pro أو Max. طرق مجانية: OpenCode مع نماذجه المجانية، أو الحصة المجانية لـ Antigravity، أو <b>No AI</b> في الإعدادات (مجاني دائمًا، اختيارات أضعف).", "L'app e la skill sono gratis. Funziona dentro uno strumento IA: Claude Code richiede un piano Claude Pro o Max. Vie gratuite: OpenCode con i suoi modelli gratuiti, la quota gratuita di Antigravity, oppure <b>No AI</b> nelle Impostazioni (sempre gratis, scelte più deboli).", "Uygulama ve skill ücretsiz. Bir yapay zekâ aracının içinde çalışır: Claude Code, Claude Pro veya Max planı gerektirir. Ücretsiz yollar: OpenCode'un ücretsiz modelleri, Antigravity'nin ücretsiz kotası ya da Ayarlar'daki <b>No AI</b> (her zaman ücretsiz, daha zayıf seçimler)."],
'h.q2':["Which AI tool should I pick?", "Quel outil IA choisir ?", "¿Qué herramienta de IA elijo?", "Qual ferramenta de IA escolher?", "Welches KI-Tool soll ich wählen?", "أي أداة ذكاء اصطناعي أختار؟", "Quale strumento IA scelgo?", "Hangi yapay zekâ aracını seçmeliyim?"],
'h.a2':["Settings &gt; AI tool lists each one with what it costs. Pick one, then press <b>Test this AI tool</b>: it says if it works, and if not, how to fix it.", "Réglages &gt; Outil IA liste chacun avec son coût. Choisissez-en un, puis appuyez sur <b>Tester cet outil IA</b> : il dit s'il fonctionne, et sinon, comment le réparer.", "Ajustes &gt; Herramienta de IA lista cada una con lo que cuesta. Elige una y pulsa <b>Probar esta herramienta de IA</b>: te dice si funciona, y si no, cómo arreglarlo.", "Ajustes &gt; Ferramenta de IA lista cada uma com o custo. Escolha uma e pressione <b>Testar esta ferramenta de IA</b>: ele diz se funciona e, se não, como corrigir.", "Einstellungen &gt; KI-Tool listet jedes mit seinen Kosten. Wähle eines und drücke <b>Dieses KI-Tool testen</b>: Es sagt, ob es funktioniert, und falls nicht, wie du es behebst.", "الإعدادات &gt; أداة الذكاء الاصطناعي تعرض كل أداة مع تكلفتها. اختر واحدة ثم اضغط <b>اختبر أداة الذكاء الاصطناعي هذه</b>: يخبرك إن كانت تعمل، وإن لم تعمل، كيف تصلحها.", "Impostazioni &gt; Strumento IA elenca ognuno con il suo costo. Scegline uno e premi <b>Testa questo strumento IA</b>: ti dice se funziona e, in caso contrario, come risolvere.", "Ayarlar &gt; Yapay zekâ aracı her birini maliyetiyle listeler. Birini seç, sonra <b>Bu yapay zekâ aracını test et</b>'e bas: çalışıp çalışmadığını ve çalışmıyorsa nasıl düzelteceğini söyler."],
'h.q3':["Where are my Shorts?", "Où sont mes Shorts ?", "¿Dónde están mis Shorts?", "Onde estão meus Shorts?", "Wo sind meine Shorts?", "أين مقاطعي؟", "Dove sono i miei Short?", "Shorts'larım nerede?"],
'h.a3':["In the folder where you ran it, and in <b>Shorts</b> here. Open one and press <b>Show in folder</b>, or <b>Export zip</b> to get the video, cover and post text together.", "Dans le dossier où vous l'avez lancée, et dans <b>Shorts</b> ici. Ouvrez-en un et appuyez sur <b>Afficher dans le dossier</b>, ou <b>Export zip</b> pour avoir la vidéo, la couverture et le texte du post ensemble.", "En la carpeta donde la ejecutaste, y en <b>Shorts</b> aquí. Abre uno y pulsa <b>Mostrar en la carpeta</b>, o <b>Export zip</b> para tener el video, la portada y el texto del post juntos.", "Na pasta onde você executou, e em <b>Shorts</b> aqui. Abra um e pressione <b>Mostrar na pasta</b>, ou <b>Export zip</b> para ter o vídeo, a capa e o texto do post juntos.", "Im Ordner, in dem du sie gestartet hast, und hier unter <b>Shorts</b>. Öffne einen und drücke <b>Im Ordner anzeigen</b> oder <b>Export zip</b>, um Video, Cover und Post-Text zusammen zu bekommen.", "في المجلد الذي شغّلتها منه، وفي <b>المقاطع</b> هنا. افتح واحدًا واضغط <b>إظهار في المجلد</b>، أو <b>Export zip</b> للحصول على الفيديو والغلاف ونص المنشور معًا.", "Nella cartella in cui l'hai avviata, e in <b>Shorts</b> qui. Aprilo e premi <b>Mostra nella cartella</b>, oppure <b>Export zip</b> per avere video, copertina e testo del post insieme.", "Çalıştırdığın klasörde ve buradaki <b>Shorts</b>'ta. Birini aç ve <b>Klasörde göster</b>'e bas, ya da videoyu, kapağı ve gönderi metnini birlikte almak için <b>Export zip</b>'a bas."],
'h.q4':["Which links work?", "Quels liens fonctionnent ?", "¿Qué enlaces funcionan?", "Quais links funcionam?", "Welche Links funktionieren?", "أي الروابط تعمل؟", "Quali link funzionano?", "Hangi bağlantılar çalışır?"],
'h.a4':["YouTube, Twitch, Kick, TikTok, X, Instagram, Facebook, Rumble, Vimeo, Reddit and Dailymotion: live streams, past streams or any video. Or press <b>Video on my PC</b> in Make for your own recording.", "YouTube, Twitch, Kick, TikTok, X, Instagram, Facebook, Rumble, Vimeo, Reddit et Dailymotion : lives, anciens directs ou toute vidéo. Ou appuyez sur <b>Vidéo sur mon PC</b> dans Créer pour votre propre enregistrement.", "YouTube, Twitch, Kick, TikTok, X, Instagram, Facebook, Rumble, Vimeo, Reddit y Dailymotion: directos, directos pasados o cualquier video. O pulsa <b>Video en mi PC</b> en Crear para tu propia grabación.", "YouTube, Twitch, Kick, TikTok, X, Instagram, Facebook, Rumble, Vimeo, Reddit e Dailymotion: lives, lives passadas ou qualquer vídeo. Ou pressione <b>Vídeo no meu PC</b> em Criar para sua própria gravação.", "YouTube, Twitch, Kick, TikTok, X, Instagram, Facebook, Rumble, Vimeo, Reddit und Dailymotion: Livestreams, vergangene Streams oder jedes Video. Oder drücke in Erstellen auf <b>Video auf meinem PC</b> für deine eigene Aufnahme.", "YouTube وTwitch وKick وTikTok وX وInstagram وFacebook وRumble وVimeo وReddit وDailymotion: بثوث مباشرة أو بثوث سابقة أو أي فيديو. أو اضغط <b>فيديو على جهازي</b> في إنشاء لتسجيلك الخاص.", "YouTube, Twitch, Kick, TikTok, X, Instagram, Facebook, Rumble, Vimeo, Reddit e Dailymotion: live, dirette passate o qualsiasi video. Oppure premi <b>Video sul mio PC</b> in Crea per la tua registrazione.", "YouTube, Twitch, Kick, TikTok, X, Instagram, Facebook, Rumble, Vimeo, Reddit ve Dailymotion: canlı yayınlar, geçmiş yayınlar veya herhangi bir video. Ya da kendi kaydın için Oluştur'da <b>PC'mde video</b>'ya bas."],
'h.q5':["How do I add my voice?", "Comment ajouter ma voix ?", "¿Cómo añado mi voz?", "Como adiciono minha voz?", "Wie füge ich meine Stimme hinzu?", "كيف أضيف صوتي؟", "Come aggiungo la mia voce?", "Sesimi nasıl eklerim?"],
'h.a5':["Open a Short, play it and pause where you want to talk, press <b>Record</b>, say one sentence (a few seconds), then <b>Make a version with my voice</b>. The game sound drops while you talk. The original stays.", "Ouvrez un Short, lisez-le et mettez en pause où vous voulez parler, appuyez sur <b>Enregistrer</b>, dites une phrase (quelques secondes), puis <b>Créer une version avec ma voix</b>. Le son du jeu baisse pendant que vous parlez. L'original reste.", "Abre un Short, reprodúcelo y pausa donde quieras hablar, pulsa <b>Grabar</b>, di una frase (unos segundos) y luego <b>Crear una versión con mi voz</b>. El sonido del juego baja mientras hablas. El original se queda.", "Abra um Short, reproduza e pause onde quiser falar, pressione <b>Gravar</b>, diga uma frase (alguns segundos) e depois <b>Criar uma versão com minha voz</b>. O som do jogo abaixa enquanto você fala. O original fica.", "Öffne einen Short, spiele ihn ab und pausiere dort, wo du sprechen willst, drücke <b>Aufnehmen</b>, sag einen Satz (ein paar Sekunden), dann <b>Version mit meiner Stimme erstellen</b>. Der Spielsound wird leiser, während du sprichst. Das Original bleibt.", "افتح مقطعًا، شغّله وأوقفه حيث تريد الكلام، اضغط <b>تسجيل</b>، قل جملة واحدة (بضع ثوانٍ)، ثم <b>أنشئ نسخة بصوتي</b>. يخفت صوت اللعبة أثناء حديثك. الأصل يبقى.", "Apri uno Short, riproducilo e metti in pausa dove vuoi parlare, premi <b>Registra</b>, di' una frase (pochi secondi), poi <b>Crea una versione con la mia voce</b>. L'audio del gioco si abbassa mentre parli. L'originale resta.", "Bir Short aç, oynat ve konuşmak istediğin yerde duraklat, <b>Kaydet</b>'e bas, bir cümle söyle (birkaç saniye), sonra <b>Sesimle bir sürüm oluştur</b>. Oyun sesi sen konuşurken kısılır. Orijinal kalır."],
'h.q6':["Can it clip a stream that has been live for hours?", "Peut-elle découper un stream en direct depuis des heures ?", "¿Puede cortar un directo que lleva horas en vivo?", "Ela consegue cortar uma live que está no ar há horas?", "Kann sie einen Stream clippen, der schon stundenlang live ist?", "هل يمكنه قص بث مباشر منذ ساعات؟", "Può tagliare una live in onda da ore?", "Saatlerdir canlı olan bir yayından klip alabilir mi?"],
'h.a6':["Live hunt watches from the moment you start it; it doesn't go back. For the hours before, wait until the stream ends and pick it under <b>Past streams</b> on the Streamers page.", "La chasse en direct regarde à partir du moment où vous la lancez ; elle ne revient pas en arrière. Pour les heures d'avant, attendez la fin du stream et choisissez-le sous <b>Anciens directs</b> sur la page Streamers.", "La caza en vivo mira desde el momento en que la inicias; no vuelve atrás. Para las horas anteriores, espera a que termine el directo y elígelo en <b>Directos pasados</b> en la página Streamers.", "A caça ao vivo assiste a partir do momento em que você a inicia; ela não volta. Para as horas anteriores, espere a live terminar e escolha em <b>Lives passadas</b> na página Streamers.", "Die Live-Jagd schaut ab dem Moment, in dem du sie startest; sie geht nicht zurück. Für die Stunden davor warte, bis der Stream endet, und wähle ihn unter <b>Vergangene Streams</b> auf der Streamer-Seite.", "الصيد المباشر يراقب من لحظة بدئه؛ لا يرجع إلى الوراء. للساعات السابقة، انتظر حتى ينتهي البث واختره من <b>البثوث السابقة</b> في صفحة البثّاثين.", "La caccia live guarda dal momento in cui la avvii; non torna indietro. Per le ore precedenti, aspetta che la diretta finisca e sceglila in <b>Dirette passate</b> nella pagina Streamer.", "Canlı av, başlattığın andan itibaren izler; geriye dönmez. Önceki saatler için yayının bitmesini bekle ve Yayıncılar sayfasında <b>Geçmiş yayınlar</b> altından seç."],
'h.q7':["It is slow. Is that normal?", "C'est lent. C'est normal ?", "Es lento. ¿Es normal?", "Está lento. Isso é normal?", "Es ist langsam. Ist das normal?", "إنه بطيء. هل هذا طبيعي؟", "È lento. È normale?", "Yavaş. Bu normal mi?"],
'h.a7':["Transcribing runs on your PC. With an NVIDIA graphics card, 1 hour of video takes about 4 minutes. Without one it takes much longer, so start with 1 to 3 Shorts.", "La transcription tourne sur votre PC. Avec une carte NVIDIA, 1 heure de vidéo prend environ 4 minutes. Sans, c'est bien plus long, alors commencez avec 1 à 3 Shorts.", "La transcripción corre en tu PC. Con una tarjeta NVIDIA, 1 hora de video tarda unos 4 minutos. Sin ella tarda mucho más, así que empieza con 1 a 3 Shorts.", "A transcrição roda no seu PC. Com uma placa NVIDIA, 1 hora de vídeo leva cerca de 4 minutos. Sem ela leva muito mais, então comece com 1 a 3 Shorts.", "Die Transkription läuft auf deinem PC. Mit einer NVIDIA-Grafikkarte dauert 1 Stunde Video etwa 4 Minuten. Ohne dauert es viel länger, also starte mit 1 bis 3 Shorts.", "النسخ النصي يعمل على جهازك. مع بطاقة NVIDIA، تستغرق ساعة واحدة من الفيديو نحو 4 دقائق. بدونها يستغرق وقتًا أطول بكثير، فابدأ بـ 1 إلى 3 مقاطع.", "La trascrizione gira sul tuo PC. Con una scheda NVIDIA, 1 ora di video richiede circa 4 minuti. Senza ci vuole molto di più, quindi inizia con 1-3 Short.", "Transkripsiyon PC'nde çalışır. NVIDIA ekran kartıyla 1 saatlik video yaklaşık 4 dakika sürer. Onsuz çok daha uzun sürer, bu yüzden 1-3 Shorts ile başla."],
'h.q8':["My disk is filling up.", "Mon disque se remplit.", "Mi disco se está llenando.", "Meu disco está enchendo.", "Meine Festplatte wird voll.", "قرصي يمتلئ.", "Il mio disco si sta riempiendo.", "Diskim doluyor."],
'h.a8':["Settings &gt; Disk space &gt; <b>Check space used</b>, then <b>Delete downloads</b>. Your Shorts and transcripts stay.", "Réglages &gt; Espace disque &gt; <b>Vérifier l'espace utilisé</b>, puis <b>Supprimer les téléchargements</b>. Vos Shorts et transcriptions restent.", "Ajustes &gt; Espacio en disco &gt; <b>Comprobar el espacio usado</b>, luego <b>Eliminar descargas</b>. Tus Shorts y transcripciones se quedan.", "Ajustes &gt; Espaço em disco &gt; <b>Verificar o espaço usado</b>, depois <b>Excluir downloads</b>. Seus Shorts e transcrições ficam.", "Einstellungen &gt; Speicherplatz &gt; <b>Belegten Speicher prüfen</b>, dann <b>Downloads löschen</b>. Deine Shorts und Transkripte bleiben.", "الإعدادات &gt; مساحة القرص &gt; <b>تحقق من المساحة المستخدمة</b>، ثم <b>حذف التنزيلات</b>. مقاطعك ونصوصها تبقى.", "Impostazioni &gt; Spazio su disco &gt; <b>Controlla lo spazio usato</b>, poi <b>Elimina download</b>. I tuoi Short e le trascrizioni restano.", "Ayarlar &gt; Disk alanı &gt; <b>Kullanılan alanı kontrol et</b>, sonra <b>İndirilenleri sil</b>. Shorts'ların ve metinlerin kalır."],
'h.q9':["Can I post them?", "Je peux les poster ?", "¿Puedo publicarlos?", "Posso postá-los?", "Darf ich sie posten?", "هل يمكنني نشرها؟", "Posso pubblicarli?", "Onları paylaşabilir miyim?"],
'h.a9':["Each streamer has a badge on the Streamers page: Clipping allowed, Has clip tips, No clipping or Rules unknown. Credit them in the post (the post text has the credit line) and add your own voice line.", "Chaque streamer a un badge sur la page Streamers : Clips autorisés, A des conseils pour les clips, Clips interdits ou Règles inconnues. Créditez-les dans le post (le texte du post contient la ligne de crédit) et ajoutez votre propre voix.", "Cada streamer tiene una insignia en la página Streamers: Clips permitidos, Tiene consejos para clips, Sin clips o Reglas desconocidas. Dales crédito en el post (el texto del post tiene la línea de crédito) y añade tu propia voz.", "Cada streamer tem um selo na página Streamers: Clipes permitidos, Tem dicas de clipes, Sem clipes ou Regras desconhecidas. Dê crédito no post (o texto do post tem a linha de crédito) e adicione sua própria voz.", "Jeder Streamer hat ein Badge auf der Streamer-Seite: Clipping erlaubt, Hat Clip-Tipps, Kein Clipping oder Regeln unbekannt. Nenne sie im Post (der Post-Text enthält die Credit-Zeile) und füge deine eigene Stimme hinzu.", "لكل بثّاث شارة في صفحة البثّاثين: القص مسموح، لديه نصائح للقص، القص ممنوع أو القواعد غير معروفة. اذكرهم في المنشور (نص المنشور يتضمن سطر الائتمان) وأضف صوتك الخاص.", "Ogni streamer ha un badge nella pagina Streamer: Clipping consentito, Ha consigli per le clip, Niente clipping o Regole sconosciute. Dai loro credito nel post (il testo del post ha la riga di credito) e aggiungi la tua voce.", "Her yayıncının Yayıncılar sayfasında bir rozeti var: Klibe izin veriyor, Klip ipuçları var, Klip yok veya Kurallar bilinmiyor. Gönderide onlara atıf ver (gönderi metninde atıf satırı var) ve kendi sesini ekle."],
'h.q10':["Mac or phone?", "Mac ou téléphone ?", "¿Mac o teléfono?", "Mac ou celular?", "Mac oder Handy?", "Mac أم هاتف؟", "Mac o telefono?", "Mac mi telefon mu?"],
'h.a10':["It runs on a computer, not a phone. It was built and tested on Windows; the Mac steps are in the skill but not tested on a Mac yet.", "Elle tourne sur un ordinateur, pas sur un téléphone. Elle a été conçue et testée sur Windows ; les étapes Mac sont dans le skill mais pas encore testées sur un Mac.", "Funciona en un ordenador, no en un teléfono. Se creó y probó en Windows; los pasos para Mac están en el skill pero aún no se han probado en un Mac.", "Ela roda em um computador, não em um celular. Foi criada e testada no Windows; os passos para Mac estão na skill, mas ainda não foram testados em um Mac.", "Sie läuft auf einem Computer, nicht auf einem Handy. Sie wurde unter Windows gebaut und getestet; die Mac-Schritte stehen im Skill, wurden aber noch nicht auf einem Mac getestet.", "يعمل على حاسوب وليس هاتفًا. بُني واختُبر على Windows؛ خطوات Mac موجودة في المهارة لكنها لم تُختبر على Mac بعد.", "Funziona su un computer, non su un telefono. È stata creata e testata su Windows; i passaggi per Mac sono nella skill ma non ancora testati su un Mac.", "Telefonda değil bilgisayarda çalışır. Windows'ta geliştirildi ve test edildi; Mac adımları skill'de var ama henüz Mac'te test edilmedi."],
'h.q11':["Something failed.", "Quelque chose a échoué.", "Algo falló.", "Algo falhou.", "Etwas ist fehlgeschlagen.", "حدث خطأ ما.", "Qualcosa è fallito.", "Bir şey başarısız oldu."],
'h.a11':["When a step fails, the app shows <b>How to fix</b> under it. Still stuck? Use <b>Propose a change</b> to tell us.", "Quand une étape échoue, l'app affiche <b>Comment réparer</b> en dessous. Toujours bloqué ? Utilisez <b>Proposer un changement</b> pour nous le dire.", "Cuando un paso falla, la app muestra <b>Cómo arreglarlo</b> debajo. ¿Sigues atascado? Usa <b>Proponer un cambio</b> para decírnoslo.", "Quando um passo falha, o app mostra <b>Como corrigir</b> embaixo. Ainda travado? Use <b>Propor uma mudança</b> para nos contar.", "Wenn ein Schritt fehlschlägt, zeigt die App <b>So behebst du es</b> darunter. Immer noch festgefahren? Nutze <b>Änderung vorschlagen</b>, um es uns zu sagen.", "عندما تفشل خطوة، يعرض التطبيق <b>كيفية الإصلاح</b> تحتها. ما زلت عالقًا؟ استخدم <b>اقترح تغييرًا</b> لإخبارنا.", "Quando un passaggio fallisce, l'app mostra <b>Come risolvere</b> sotto. Ancora bloccato? Usa <b>Proponi una modifica</b> per dircelo.", "Bir adım başarısız olunca uygulama altında <b>Nasıl düzeltilir</b>'i gösterir. Hâlâ takıldın mı? Bize söylemek için <b>Değişiklik öner</b>'i kullan."],
'prop.delivered':["Thanks, it's sent. We read every message.", "Merci, c'est envoyé. Nous lisons chaque message.", "Gracias, enviado. Leemos cada mensaje.", "Obrigado, foi enviado. Lemos cada mensagem.", "Danke, gesendet. Wir lesen jede Nachricht.", "شكرًا، تم الإرسال. نقرأ كل رسالة.", "Grazie, inviato. Leggiamo ogni messaggio.", "Teşekkürler, gönderildi. Her mesajı okuyoruz."],
'prop.contact':["Your email (optional, so we can answer)", "Votre e-mail (facultatif, pour vous répondre)", "Tu correo (opcional, para responderte)", "Seu e-mail (opcional, para respondermos)", "Deine E-Mail (optional, damit wir antworten können)", "بريدك الإلكتروني (اختياري، لنرد عليك)", "La tua email (facoltativa, per risponderti)", "E-postan (isteğe bağlı, sana cevap verebilmemiz için)"],

'ui.ap_explain':['An OS scheduled task starts this app\'s headless run on the days below: the linked AI makes the Shorts into runs/run_&lt;date&gt;, then they are spread across the day. Your PC must be on and logged in at that time.','Une tâche planifiée du système lance l\'exécution sans fenêtre de cette app aux jours ci-dessous : l\'IA liée crée les Shorts dans runs/run_&lt;date&gt;, puis ils sont répartis sur la journée. Votre PC doit être allumé et la session ouverte à ce moment.','Una tarea programada del sistema inicia la ejecución sin ventana de esta app en los días de abajo: la IA vinculada crea los Shorts en runs/run_&lt;date&gt; y luego se reparten durante el día. Tu PC debe estar encendido y con la sesión iniciada a esa hora.','Uma tarefa agendada do sistema inicia a execução sem janela deste app nos dias abaixo: a IA vinculada cria os Shorts em runs/run_&lt;date&gt; e depois eles são distribuídos ao longo do dia. Seu PC precisa estar ligado e com a sessão iniciada nesse horário.','Eine geplante Systemaufgabe startet den Lauf dieser App ohne Fenster an den Tagen unten: Die verknüpfte KI erstellt die Shorts in runs/run_&lt;date&gt;, danach werden sie über den Tag verteilt. Dein PC muss dann eingeschaltet und angemeldet sein.','تبدأ مهمة مجدولة في النظام تشغيل هذا التطبيق دون نافذة في الأيام أدناه: يُنشئ الذكاء الاصطناعي المرتبط المقاطع في runs/run_&lt;date&gt; ثم تُوزَّع على مدار اليوم. يجب أن يكون جهازك مشغّلًا ومسجّلًا الدخول في ذلك الوقت.','Un\'attività pianificata del sistema avvia l\'esecuzione senza finestra di questa app nei giorni sotto: l\'IA collegata crea gli Shorts in runs/run_&lt;date&gt;, poi vengono distribuiti nell\'arco della giornata. Il tuo PC deve essere acceso e con l\'accesso effettuato a quell\'ora.','İşletim sisteminde zamanlanmış bir görev, aşağıdaki günlerde bu uygulamanın penceresiz çalıştırmasını başlatır: bağlı yapay zekâ Shorts\'ları runs/run_&lt;date&gt; içine yapar, sonra gün boyunca dağıtılır. O saatte bilgisayarın açık ve oturumun açık olmalı.'],

'ui.qn_claude':['Best quality: runs the whole pipeline itself (download, pick, render, QC).','Meilleure qualité : exécute tout le pipeline lui-même (téléchargement, choix, rendu, contrôle qualité).','Mejor calidad: ejecuta todo el proceso él mismo (descarga, selección, renderizado, control de calidad).','Melhor qualidade: executa todo o processo sozinho (download, seleção, renderização, controle de qualidade).','Beste Qualität: führt die gesamte Pipeline selbst aus (Download, Auswahl, Rendern, Qualitätsprüfung).','أفضل جودة: ينفّذ المسار كاملًا بنفسه (التنزيل والاختيار والإنتاج وفحص الجودة).','Qualità migliore: esegue da solo l\'intera pipeline (download, scelta, rendering, controllo qualità).','En iyi kalite: tüm hattı kendisi çalıştırır (indirme, seçme, oluşturma, kalite kontrolü).'],
'ui.qn_codex':['Good: full-access codex exec runs the pipeline; slower start, flaky startup possible.','Bon : codex exec en accès complet exécute le pipeline ; démarrage plus lent, démarrage parfois instable.','Bueno: codex exec con acceso completo ejecuta el proceso; arranque más lento, el inicio puede fallar a veces.','Bom: o codex exec com acesso total executa o processo; início mais lento, a inicialização pode falhar às vezes.','Gut: codex exec mit Vollzugriff führt die Pipeline aus; langsamerer Start, instabiler Start möglich.','جيد: يشغّل codex exec بصلاحيات كاملة المسار؛ بدء أبطأ وقد يتعثر البدء أحيانًا.','Buono: codex exec con accesso completo esegue la pipeline; avvio più lento, possibile avvio instabile.','İyi: tam erişimli codex exec hattı çalıştırır; başlangıç daha yavaş, başlangıçta aksaklık olabilir.'],
'ui.qn_gemini':['Decent picks; free tier; tool use less reliable than Claude.','Choix corrects ; offre gratuite ; utilisation des outils moins fiable que Claude.','Selecciones decentes; nivel gratuito; el uso de herramientas es menos fiable que Claude.','Escolhas razoáveis; plano grátis; uso de ferramentas menos confiável que o Claude.','Ordentliche Auswahl; kostenlose Stufe; Tool-Nutzung weniger zuverlässig als Claude.','اختيارات مقبولة؛ طبقة مجانية؛ استخدام الأدوات أقل موثوقية من Claude.','Scelte discrete; piano gratuito; uso degli strumenti meno affidabile di Claude.','Fena seçimler; ücretsiz katman; araç kullanımı Claude kadar güvenilir değil.'],
'ui.qn_kimi':['Cheap builder; fine for picks and edits; verify the output.','Outil économique ; correct pour les choix et les modifications ; vérifiez le résultat.','Constructor barato; bueno para selecciones y ediciones; verifica el resultado.','Construtor barato; bom para escolhas e edições; verifique o resultado.','Günstiger Builder; gut für Auswahl und Änderungen; Ergebnis prüfen.','منفّذ رخيص؛ جيد للاختيار والتعديلات؛ تحقق من النتيجة.','Costruttore economico; va bene per scelte e modifiche; verifica il risultato.','Ucuz oluşturucu; seçimler ve düzenlemeler için yeterli; çıktıyı kontrol et.'],
'ui.qn_opencode':['Works with its free models (no account) or your own model; free models pick weaker than Claude, verify the output.','Fonctionne avec ses modèles gratuits (sans compte) ou votre propre modèle ; les modèles gratuits choisissent moins bien que Claude, vérifiez le résultat.','Funciona con sus modelos gratuitos (sin cuenta) o con tu propio modelo; los modelos gratuitos eligen peor que Claude, verifica el resultado.','Funciona com seus modelos grátis (sem conta) ou seu próprio modelo; os modelos grátis escolhem pior que o Claude, verifique o resultado.','Funktioniert mit den kostenlosen Modellen (ohne Konto) oder deinem eigenen Modell; kostenlose Modelle wählen schwächer als Claude, Ergebnis prüfen.','يعمل بنماذجه المجانية (دون حساب) أو بنموذجك الخاص؛ النماذج المجانية تختار أضعف من Claude، تحقق من النتيجة.','Funziona con i suoi modelli gratuiti (senza account) o con il tuo modello; i modelli gratuiti scelgono peggio di Claude, verifica il risultato.','Ücretsiz modelleriyle (hesapsız) veya kendi modelinle çalışır; ücretsiz modeller Claude\'dan daha zayıf seçer, çıktıyı kontrol et.'],
'ui.qn_antigravity':['Google\'s agent CLI (Gemini or Claude models, Google sign-in); verify the output.','CLI agent de Google (modèles Gemini ou Claude, connexion Google) ; vérifiez le résultat.','CLI de agentes de Google (modelos Gemini o Claude, inicio de sesión de Google); verifica el resultado.','CLI de agente do Google (modelos Gemini ou Claude, login do Google); verifique o resultado.','Googles Agent-CLI (Gemini- oder Claude-Modelle, Google-Anmeldung); Ergebnis prüfen.','واجهة وكيل Google بسطر الأوامر (نماذج Gemini أو Claude، تسجيل الدخول بحساب Google)؛ تحقق من النتيجة.','CLI agente di Google (modelli Gemini o Claude, accesso Google); verifica il risultato.','Google\'ın ajan CLI\'ı (Gemini veya Claude modelleri, Google girişi); çıktıyı kontrol et.'],
'ui.qn_ollama':['Free and offline but text only: it can improve hooks/titles and apply edits as JSON; picks come from chat spikes + loudness, then batch.py renders.','Gratuit et hors ligne mais texte seulement : il peut améliorer accroches/titres et appliquer des modifications en JSON ; les choix viennent des pics du chat + du volume, puis batch.py génère.','Gratis y sin conexión pero solo texto: puede mejorar ganchos/títulos y aplicar ediciones como JSON; las selecciones vienen de picos del chat + volumen, luego batch.py renderiza.','Grátis e offline, mas só texto: pode melhorar ganchos/títulos e aplicar edições como JSON; as escolhas vêm de picos do chat + volume, depois o batch.py renderiza.','Kostenlos und offline, aber nur Text: kann Hooks/Titel verbessern und Änderungen als JSON anwenden; die Auswahl kommt aus Chat-Spitzen + Lautstärke, dann rendert batch.py.','مجاني ويعمل دون إنترنت لكن للنص فقط: يمكنه تحسين الخطّافات/العناوين وتطبيق التعديلات بصيغة JSON؛ تأتي الاختيارات من ذروات الدردشة + ارتفاع الصوت ثم يُنتج batch.py.','Gratuito e offline ma solo testo: può migliorare hook/titoli e applicare modifiche in JSON; le scelte arrivano dai picchi della chat + volume, poi batch.py esegue il rendering.','Ücretsiz ve çevrimdışı ama yalnızca metin: kancaları/başlıkları iyileştirebilir ve düzenlemeleri JSON olarak uygular; seçimler sohbet yoğunluğu + ses yüksekliğinden gelir, sonra batch.py oluşturur.'],
'ui.qn_custom':['Your own command; put {prompt_file} where the prompt file path goes (else the prompt is sent on stdin).','Votre propre commande ; mettez {prompt_file} à l\'endroit du chemin du fichier de prompt (sinon le prompt est envoyé sur stdin).','Tu propio comando; pon {prompt_file} donde va la ruta del archivo del prompt (si no, el prompt se envía por stdin).','Seu próprio comando; coloque {prompt_file} onde vai o caminho do arquivo do prompt (senão o prompt é enviado por stdin).','Dein eigener Befehl; setze {prompt_file} dorthin, wo der Pfad der Prompt-Datei steht (sonst wird der Prompt über stdin gesendet).','أمرك الخاص؛ ضع {prompt_file} مكان مسار ملف الموجّه (وإلا يُرسل الموجّه عبر stdin).','Il tuo comando; metti {prompt_file} dove va il percorso del file del prompt (altrimenti il prompt viene inviato su stdin).','Kendi komutun; istem dosyası yolunun geleceği yere {prompt_file} yaz (yoksa istem stdin üzerinden gönderilir).'],
'ui.qn_none':['Lowest effort: picks from chat spikes + loudness (nopick.py), rendered by batch.py. No titles by AI, no edit-by-words.','Effort minimal : choix selon les pics du chat + le volume (nopick.py), généré par batch.py. Pas de titres par IA, pas de modification par les mots.','Mínimo esfuerzo: selecciones por picos del chat + volumen (nopick.py), renderizado por batch.py. Sin títulos de IA ni edición por palabras.','Esforço mínimo: escolhas por picos do chat + volume (nopick.py), renderizado pelo batch.py. Sem títulos de IA, sem edição por palavras.','Geringster Aufwand: Auswahl nach Chat-Spitzen + Lautstärke (nopick.py), gerendert von batch.py. Keine KI-Titel, keine Bearbeitung per Worten.','أقل جهد: اختيارات من ذروات الدردشة + ارتفاع الصوت (nopick.py) ويُنتجها batch.py. بلا عناوين من الذكاء الاصطناعي ولا تعديل بالكلمات.','Sforzo minimo: scelte da picchi della chat + volume (nopick.py), rendering con batch.py. Nessun titolo IA, nessuna modifica a parole.','En az çaba: seçimler sohbet yoğunluğu + ses yüksekliğinden (nopick.py), batch.py ile oluşturulur. Yapay zekâ başlığı yok, sözle düzenleme yok.'],

'ui.yt_desc':['Use your own keys. They stay on this PC and are write-only here. Level 1: API key = views, likes, why-not-better rules. Level 2: OAuth client = watch time and drop-off.','Utilisez vos propres clés. Elles restent sur ce PC et sont en écriture seule ici. Niveau 1 : clé API = vues, likes, règles « pourquoi ça marche moins ». Niveau 2 : client OAuth = temps de visionnage et décrochage.','Usa tus propias claves. Se quedan en este PC y aquí son solo de escritura. Nivel 1: clave API = vistas, me gusta, reglas de por qué no rinde más. Nivel 2: cliente OAuth = tiempo de reproducción y abandono.','Use suas próprias chaves. Elas ficam neste PC e aqui são somente de escrita. Nível 1: chave de API = views, curtidas, regras de por que não vai melhor. Nível 2: cliente OAuth = tempo de exibição e abandono.','Nutze deine eigenen Schlüssel. Sie bleiben auf diesem PC und sind hier nur schreibbar. Stufe 1: API-Schlüssel = Aufrufe, Likes, Regeln, warum es nicht besser läuft. Stufe 2: OAuth-Client = Wiedergabezeit und Absprünge.','استخدم مفاتيحك الخاصة. تبقى على هذا الجهاز وهي للكتابة فقط هنا. المستوى 1: مفتاح API = المشاهدات والإعجابات وقواعد سبب ضعف الأداء. المستوى 2: عميل OAuth = وقت المشاهدة ونقاط المغادرة.','Usa le tue chiavi. Restano su questo PC e qui sono solo in scrittura. Livello 1: chiave API = visualizzazioni, mi piace, regole su perché non va meglio. Livello 2: client OAuth = tempo di visione e abbandoni.','Kendi anahtarlarını kullan. Bu bilgisayarda kalır ve burada yalnızca yazılabilir. Seviye 1: API anahtarı = izlenme, beğeni, neden daha iyi gitmediği kuralları. Seviye 2: OAuth istemcisi = izlenme süresi ve terk edilme.'],

async function runBusy(){const j=arr(await api('/api/jobs'));return j.some(x=>x.status=='running'&&!x.dry)}

 if(!await ask(t('upd.ask',{v:UPDI.latest}),{ok:t('upd.now'),pre:t('upd.safe')}))return;toast(t('upd.running'));const r=await api('/api/update/apply',{});
 if(r&&r.ok&&r.changed!==false){UPDI=null;paintUpd();toast(t('upd.done',{v:r.version||r.current||''}));setTimeout(()=>location.reload(),2500)}else toast(t('upd.failed'),true)}

// ---------- what's new (release notes from CHANGELOG.md: site first, shipped copy offline) ----------
let CHL=null;const vtJ=v=>String(v||'').split('.').map(Number),vgt=(a,b)=>{const x=vtJ(a),y=vtJ(b);for(let i=0;i<3;i++){if((x[i]||0)!=(y[i]||0))return (x[i]||0)>(y[i]||0)}return false};
async function chl(){if(!CHL){const r=await api('/api/changelog');CHL=r&&Array.isArray(r.versions)?r:{versions:[],current:''}}return CHL}
function wnHtml(vs,cur,open){return vs.map((v,i)=>{const main=v.sections.filter(s=>!/^test/i.test(s.h)),tst=v.sections.find(s=>/^test/i.test(s.h));
 return `<details ${i<open?'open':''} class=wn><summary><b>${esc(v.v)}</b>${v.v==cur?` <span class="chip PASS">${te('wn.yours')}</span>`:vgt(v.v,cur)?` <span class="chip WARN">${te('wn.new')}</span>`:''}</summary>${main.map(s=>`<small class=m>${esc(s.h)}</small><ul>${s.items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`).join('')}${tst&&tst.items.length?`<small class=m>\u2713 ${te('wn.tested')}: ${esc(tst.items[0])}</small>`:''}</details>`}).join('')}
async function paintWN(el){if(!el)return;const c=await chl();if(!c.versions.length){el.innerHTML='';return}const cur=(UPDI&&UPDI.current)||c.current,news=c.versions.filter(v=>vgt(v.v,cur));let all=false;
 const draw=()=>{el.innerHTML=(news.length?`<h3>${te('wn.coming')}</h3>${wnHtml(news,cur,news.length)}`:'')+`<h3>${te('wn.title')}</h3><small class=m>${te('wn.sub')}</small>${wnHtml(c.versions.filter(v=>!vgt(v.v,cur)).slice(0,all?99:3),cur,1)}${!all&&c.versions.length-news.length>3?`<button class=sm id=wn_all>${te('wn.all')}</button>`:''}`;if(E('wn_all'))E('wn_all').onclick=()=>{all=true;draw()}};draw()}
async function wnOnce(){const c=await chl(),cur=c.current;if(!cur||!c.versions.length)return;const seen=lsGet('clipper_seen_ver');lsSet('clipper_seen_ver',cur);if(!seen||seen==cur||!vgt(cur,seen))return;
 const vs=c.versions.filter(v=>vgt(v.v,seen)&&!vgt(v.v,cur));if(!vs.length)return;const d=E('wn');E('wn_t').textContent=t('wn.after',{v:cur});E('wn_s').textContent=t('wn.sub');E('wn_b').innerHTML=wnHtml(vs,cur,vs.length);E('wn_ok').textContent=t('wn.ok');d.showModal()}

const sKey=s=>s.platform+':'+String(s.handle).toLowerCase();
function parseStr(x){x=x.trim();let m;if(m=x.match(/twitch\.tv\/([\w.\-]+)/i))return{platform:'twitch',handle:m[1]};if(m=x.match(/kick\.com\/([\w.\-]+)/i))return{platform:'kick',handle:m[1]};if(m=x.match(/youtube\.com\/(@[\w.\-]+)/i))return{platform:'youtube',handle:m[1]};if(/^@[\w.\-]+$/.test(x))return{platform:'youtube',handle:x};if(/^[\w.\-]{1,60}$/.test(x))return{platform:'twitch',handle:x};return null}
const strAdd=(lang,s)=>api('/api/streamers',{lang,platform:s.platform,handle:s.handle,name:s.name||s.handle,add:true});
const strRm=(lang,s)=>api('/api/streamers',{lang,platform:s.platform,handle:s.handle,remove:true});
const rmGet=()=>{try{return JSON.parse(lsGet('clipper_rm_'+LANG)||'[]')}catch(e){return[]}};
const strMade=s=>{const n=String(s.name).toLowerCase(),h=String(s.handle).replace('@','').toLowerCase();return D.shorts.filter(x=>{const c=((x.stream.channel||'')+' '+(x.stream.title||'')).toLowerCase();return c.includes(n)||c.includes(h)}).length};
const CLIPC={allowed:['PASS','clip.allowed'],ask:['len','clip.ask'],no:['FAIL','clip.no'],unknown:['na','clip.unknown']};
const clipChip=c=>{c=c||{rule:'unknown'};const [k,l]=CLIPC[c.rule]||CLIPC.unknown,tip=esc(c.note||(c.rule=='unknown'?t('clip.unknown_tip'):''));return c.source?`<a class="chip ${k}" href="${esc(c.source)}" target=_blank rel=noopener title="${tip}">${te(l)}</a>`:`<span class="chip ${k}" title="${tip}">${te(l)}</span>`};
const clipOk=async c=>!(c&&c.rule=='no')||await ask(t('clip.no_ask')+(c.note?'\n'+c.note:''),{ok:t('clip.have_perm')});
const hSt=r=>r.watching&&r.live?['PASS','hunt.st.watching']:r.watching?['na','hunt.st.waiting']:r.live?['WARN','str.live_now']:['na','str.offline'];
const hRow=r=>{const [c,k]=hSt(r);return `<div class=hrow><b>${esc(r.name)}</b>${clipChip(r.clip)}<span class=m style="flex:1 1 140px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.title||'')}</span><span class="chip ${c}">${te(k)}</span><small>${r.chat_per_min==null?'':te('hunt.chat',{n:Math.round(r.chat_per_min)})}</small><small>${te((r.clips_found||0)==1?'hunt.clip':'hunt.clips',{n:r.clips_found||0})}</small><button class=sm data-hsee="${esc(r.name)}">${te('hunt.see_clips')}</button></div>`};
function paintHunt(el,max){if(!el||!el.isConnected)return;if(!Array.isArray(HUNT)){el.innerHTML=`<div class=err>${esc((HUNT&&HUNT.error)||'')}</div>`;return}
 const rows=HUNT.filter(r=>r.live||r.watching);
 if(!HUNTON&&!rows.some(r=>r.watching))el.innerHTML=`<p class=m>${te('empty.hunt_off')} ${te('hunt.since')}</p><div class=row><button class=p data-hunt=on>${te('hunt.start')}</button></div>`;
 else if(!rows.length)el.innerHTML=`<p class=m>${te('empty.hunt_idle')}</p>`;
 else el.innerHTML=rows.slice(0,max).map(hRow).join('')+(max<rows.length?`<button class=sm data-go=str>${te('hunt.see_all')} (${rows.length})</button>`:'')+`<small class=m>${te('hunt.footer')} ${te('hunt.since')}</small>`}
async function loadHunt(el,max){el.innerHTML=`<small class=m><span class=spin></span></small>`;HUNT=await api('/api/hunt?lang='+LANG);paintHunt(el,max);return HUNT}
async function huntSet(on){HUNTON=on;lsSet('clipper_hunt',on?'1':'0');const rows=Array.isArray(HUNT)?HUNT:[];
 for(const r of rows){if(on&&r.live&&!r.watching&&!(r.clip&&r.clip.rule=='no'))await api('/api/hunt/start',{platform:r.platform,handle:r.handle});if(!on&&r.watching)await api('/api/hunt/stop',{platform:r.platform,handle:r.handle})}draw()}
